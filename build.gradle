plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    mavenCentral()
    maven { url = 'https://chickenbones.net/maven' }
    maven { url = 'https://maven.blamejared.com/' }
}

dependencies {
    implementation 'net.neoforged:neoforge:21.1.72'
    implementation 'com.brandon3055.brandonscore:BrandonsCore:1.21.1-3.2.1.309'
    implementation 'io.codechicken:CodeChickenLib:1.21.1-4.6.1.529'
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        crystalnetwork { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
